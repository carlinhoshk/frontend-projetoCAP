<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Dashboard do Aluno</h1>
    <div class="user-info">
      <span>Bem-vindo, {{ alunoEmail }}</span>
      <button (click)="logout()" class="logout-btn">Sair</button>
    </div>
  </header>

  <main class="dashboard-content">
    <section class="dashboard-section">
      <h2>Minhas Turmas</h2>
      <!-- Aqui você pode adicionar a lista de turmas do aluno -->
    </section>

    <section class="dashboard-section">
      <h2>Atividades Pendentes</h2>
      <!-- Aqui você pode adicionar as atividades pendentes -->
    </section>

    <section class="dashboard-section">
      <h2>Notas</h2>
      <!-- Aqui você pode adicionar as notas do aluno -->
    </section>
  </main>
</div>
