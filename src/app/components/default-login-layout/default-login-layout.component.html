<main>
  <div class="login-container">
    <section class="main-section">
      <img src="/assets/svg/main-logo3.svg" alt="Logo do Projeto CAP" />
    </section>
    <section class="form-section">
      <img src="assets/svg/logo.svg" />
      <h2>{{ title }}</h2>
      <ng-content></ng-content>
      <div class="btn-wrapper">
        <button class="btn-primary" (click)="submit()" [disabled]="disabledPrimaryBtn">{{ primaryBtnText }}</button>
        <div class="divider">
          <div></div>
          <span>ou</span>
          <div></div>
        </div>
        <button class="btn-secondary" (click)="navigate()">{{ secondaryBtnText }}</button>
      </div>
    </section>
  </div>
</main>
