<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Dashboard do Professor</h1>
    <div class="user-info">
      <span>Bem-vindo, {{ professorEmail }}</span>
      <button (click)="logout()" class="logout-btn">Sair</button>
    </div>
  </header>

  <main class="dashboard-content">
    <div class="dashboard-cards">
      <section class="dashboard-card" (click)="navegarParaTurmas()">
        <div class="card-icon">
          <i class="fas fa-users"></i>
        </div>
        <h2>Minhas Turmas</h2>
        <p>Gerenciar suas turmas e alunos</p>
      </section>

      <section class="dashboard-card" (click)="navegarParaAtribuicaoNotas()">
        <div class="card-icon">
          <i class="fas fa-clipboard-check"></i>
        </div>
        <h2>Atribuição de Notas</h2>
        <p>Atribuir notas e presença aos alunos</p>
      </section>

      <section class="dashboard-card" (click)="navegarParaAtividadesRecentes()">
        <div class="card-icon">
          <i class="fas fa-history"></i>
        </div>
        <h2>Atividades Recentes</h2>
        <p>Ver suas atividades recentes no sistema</p>
      </section>
    </div>
  </main>
</div>
