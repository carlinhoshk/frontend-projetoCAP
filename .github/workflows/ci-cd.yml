name: Frontend CI/CD Pipeline

permissions:
  contents: write

on:
  push:
    branches: [ master, main, branch-dev ]
  pull_request:
    branches: [ master, main, branch-dev ]

env:
  DOCKER_IMAGE: carlinhoshk/frontend-projetocap
  DOCKER_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: Dockerhub-cred
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Run linting
        run: npm run lint || true
        
      - name: Executar testes unitários simples
        run: npm test -- --watch=false --browsers=ChromeHeadless --karma-config=karma.conf.ci.js || true
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ESBUILD_BINARY_PATH: node_modules/esbuild/bin/esbuild
        
      - name: Build project
        run: npm run build -- --configuration=production
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ESBUILD_BINARY_PATH: node_modules/esbuild/bin/esbuild

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }},${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:latest
          cache-to: type=inline
      
      - name: Verificação básica da imagem
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}:latest
          docker image inspect ${{ env.DOCKER_IMAGE }}:latest 