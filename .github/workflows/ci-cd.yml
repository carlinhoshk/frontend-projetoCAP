name: Frontend CI/CD Pipeline

permissions:
  contents: write

on:
  push:
    branches: [ master, main, branch-dev ]
  pull_request:
    branches: [ master, main, branch-dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Run linting
        run: npm run lint || true
        
      - name: Executar testes unitários simples
        run: npm test -- --watch=false --browsers=ChromeHeadless --karma-config=karma.conf.ci.js || true
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ESBUILD_BINARY_PATH: node_modules/esbuild/bin/esbuild
        
      - name: Build project
        run: npm run build -- --configuration=production
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ESBUILD_BINARY_PATH: node_modules/esbuild/bin/esbuild
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/login-page/browser/
          
      - name: Criar Release no GitHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          body: |
            - Release automática gerada pelo CI.
            - Commit: ${{ github.sha }}
            - Data: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
          files: dist/login-page/browser/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}